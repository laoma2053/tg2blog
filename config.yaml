  baidu:   "https://pan.baidu.com/s/1d2kpf_PogQXfkomoqmrxeg?pwd=zhui"
  thunder: "https://pan.xunlei.com/s/VOmmtFDZ2Dx1N67g9kI95SW3A1?pwd=sbqq"
  uc:      "https://drive.uc.cn/s/79521dbef0864?public=1"

# ── 过滤规则 ──────────────────────────────────────────────────────────────────

filter:

  # 命中任一关键词 → 丢弃整条消息
  block_keywords:
    - "抽奖"
    - "注册"
    - "娱乐"
    - "新会员"
    - "搜索"

  # 命中任一正则 → 丢弃整条消息（Python re 语法）
  block_regex:
    - "telegram\\.me/"
    - "t\\.me/"

  # 文本清洗规则（按顺序执行）
  # 保留消息，但在解析前删除以下内容，避免干扰片名/集数提取
  clean_rules:
    # 删除"链接/阿里/夸克/百度：https://..."整行
    - pattern: "(?m)^(?:链接|阿里|夸克|百度)[:：]\\s*https?://\\S+\\s*$"
      repl: ""

    # 删除"📤 资源链接：..."整行
    - pattern: "(?m)^📤\\s*资源链接[:：].*$"
      repl: ""

    # 删除"🍟 投稿人：..."到字符串末尾（尾部导流块）
    - pattern: "(?s)🍟\\s*投稿人[：:].*$"
      repl: ""

    # 删除所有剩余 http/https 链接
    - pattern: "https?://\\S+"
      flags: "i"
      repl: ""

    # 清理多余空行
    - pattern: "\\n{3,}"
      repl: "\\n\\n"
