  - "@jpnd5"
  - "@fcij5"
  - "@jnjy_5"
  - "@xvth5"
  #- "@djya5"
  - "@Aliyun_4K_Movies"
  - "@Netdisk_Movies"
  #- "@kfcfoodcourt"

# ── 主站与导流 ────────────────────────────────────────────────────────────────
site:
  # 主站地址，用于文章底部备用导流文字链接
  main_url: "https://www.zhuiju.us"

  # 站内搜索前缀，文章中拼接片名生成搜索链接（结尾须含路径分隔符或 ?q= 等）
  # 示例：https://www.zhuiju.us/s/ → 最终链接 https://www.zhuiju.us/s/片名
  # 留空则自动降级为 main_url + /s/
  search_prefix: "https://www.zhuiju.us/s/"

  # 备用搜索入口的显示标签（文章中 <strong> 前缀文字）
  alt_search_label: "备用（夸克）"

  # 备用搜索前缀，留空则文章中不渲染备用搜索行
  # 示例：https://www.kuake.so/search?q= → 最终链接 https://www.kuake.so/search?q=片名
  alt_search_prefix: "https://pansou.de/search?q="

# ── 网盘固定入口（所有文章底部统一展示）─────────────────────────────────────────
netdisk:
  quark:   "https://pan.quark.cn/s/31b3479e3209"
  baidu:   "https://pan.baidu.com/s/1d2kpf_PogQXfkomoqmrxeg?pwd=zhui"
  thunder: "https://pan.xunlei.com/s/VOmmtFDZ2Dx1N67g9kI95SW3A1?pwd=sbqq"
  uc:      "https://drive.uc.cn/s/79521dbef0864"

# ── TMDB 行为 ─────────────────────────────────────────────────────────────────
tmdb:
  # 标题或标签命中以下关键词时，跳过 TMDB 查询
  skip_keywords:
    - "短剧"
    - "音乐"
    - "综艺"

  # 文章中展示的 TMDB 影评条数
  max_reviews: 2

# ── 过滤规则 ──────────────────────────────────────────────────────────────────

filter:

  # 命中任一关键词 → 丢弃整条消息
  block_keywords:
    - "抽奖"
    - "注册"
    - "娱乐"
    - "新会员"
    - "搜索"
    - "推广"
    - "广告"
    - "赞助"
    - "加入会员"
    - "限时优惠"
    - "点击加入"
    - "互推"

  # 命中任一正则 → 丢弃整条消息（Python re 语法）
  block_regex: []

  # 文本清洗规则（按顺序执行）
  # 保留消息，但在解析前删除以下内容，避免干扰片名/集数提取
  clean_rules:
    # 删除"链接/阿里/夸克/百度：https://..."整行
    - pattern: "(?m)^(?:链接|阿里|夸克|百度)[:：]\\s*https?://\\S+\\s*$"
      repl: ""

    # 删除"📤 资源链接：..."整行
    - pattern: "(?m)^📤\\s*资源链接[:：].*$"
      repl: ""

    # 删除"🍟 投稿人：..."到字符串末尾（尾部导流块）
    - pattern: "(?s)🍟\\s*投稿人[：:].*$"
      repl: ""

    # 删除所有剩余 http/https 链接
    - pattern: "https?://\\S+"
      flags: "i"
      repl: ""

    # 清理多余空行
    - pattern: "\\n{3,}"
      repl: "\\n\\n"
